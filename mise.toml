[tools]
node = "lts"

[tasks.dev]
description = "Start Vite dev server"
run = "npm run dev"

[tasks.build]
description = "Type-check and build"
run = "npm run build"

[tasks.lint]
description = "Run ESLint"
run = "npm run lint"

[tasks.test]
description = "Run Vitest"
run = "npm run test"

[tasks."ext:build"]
description = "Build browser extension (Chrome zip + Firefox xpi) into dist-ext/"
run = "node scripts/build-extension.mjs"
